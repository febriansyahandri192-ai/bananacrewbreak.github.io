      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {

      background: #cbd5e1;

      background: #334155;
    }

      body * {

      }

</head>
<body class="h-full flex flex-col text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

    <!-- UI dynamic content will be rendered here by JS -->
  </div>

  <script>
    const APP_STATE = {
      currentUser: null,
      activeTab: 'dashboard',
      theme: localStorage.getItem('cba_theme') || 'light',
      crews: [],
      breaks: [],
      breakTypes: [],
      auditLogs: [],
      settings: {
        googleSheetsUrl: '',
        autoSheetsSync: true,
        companyName: 'Kedai Kopi Utama',
      },
      scanner: null,
      activeScanResult: null,
      activeModal: null, // 'addCrew', 'editCrew', 'qrCode', 'sheetsConfig'
      selectedCrewForModal: null,

      historyFilters: {
        date: '',
        crewId: '',
        breakType: '',
        status: ''

    function applyTheme() {
      if (APP_STATE.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('cba_theme', APP_STATE.theme);
    }

    function toggleTheme() {
      APP_STATE.theme = APP_STATE.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      renderApp();
      showToast(`Mode ${APP_STATE.theme === 'dark' ? 'Gelap (Dark)' : 'Terang (Light)'} diaktifkan`, 'info');
    }

    // Helper functions for initial seed data

        { id: 'bt_3', name: 'Personal Break', maxMinutes: 10, color: 'amber' },
        { id: 'bt_4', name: 'Prayer Break', maxMinutes: 20, color: 'purple' },
      ];

      const initialCrews = [
        { id: 'crw_1', crewId: 'CRW001', name: 'Budi Santoso', position: 'Senior Barista', department: 'Service', phone: '081234567890', status: 'Active', createdAt: '2026-01-10' },
        { id: 'crw_2', crewId: 'CRW002', name: 'Siti Rahma', position: 'Cashier', department: 'Front Desk', phone: '081298765432', status: 'Active', createdAt: '2026-01-12' },
        { id: 'crw_3', crewId: 'CRW003', name: 'Andi Wijaya', position: 'Kitchen Crew', department: 'Kitchen', phone: '081355554444', status: 'Active', createdAt: '2026-02-01' },
        { id: 'crw_4', crewId: 'CRW004', name: 'Dewi Lestari', position: 'Waitress', department: 'Service', phone: '081711223344', status: 'Active', createdAt: '2026-02-15' },
        { id: 'crw_5', crewId: 'CRW005', name: 'Rian Hidayat', position: 'Dishwasher', department: 'Kitchen', phone: '081899887766', status: 'Active', createdAt: '2026-03-01' },

      const todayStr = new Date().toISOString().split('T')[0];

          endTime: break2End.toISOString(),

          endedBy: 'manager@email.com',

        { id: 'log_1', timestamp: new Date(now.getTime() - 25 * 60000).toISOString(), manager: 'manager@email.com', action: 'START BREAK', crewId: 'CRW001', crewName: 'Budi Santoso' },
        { id: 'log_2', timestamp: new Date(now.getTime() - 70 * 60000).toISOString(), manager: 'manager@email.com', action: 'START BREAK', crewId: 'CRW002', crewName: 'Siti Rahma' },
        { id: 'log_3', timestamp: new Date(now.getTime() - 25 * 60000).toISOString(), manager: 'manager@email.com', action: 'END BREAK', crewId: 'CRW002', crewName: 'Siti Rahma' }

      // Load local storage if available
      const storedCrews = localStorage.getItem('cba_crews');
      const storedBreaks = localStorage.getItem('cba_breaks');
      const storedBreakTypes = localStorage.getItem('cba_breakTypes');
      const storedLogs = localStorage.getItem('cba_auditLogs');
      const storedUser = localStorage.getItem('cba_user');

      APP_STATE.crews = storedCrews ? JSON.parse(storedCrews) : initialCrews;
      APP_STATE.breaks = storedBreaks ? JSON.parse(storedBreaks) : initialBreaks;
      APP_STATE.breakTypes = storedBreakTypes ? JSON.parse(storedBreakTypes) : initialBreakTypes;
      APP_STATE.auditLogs = storedLogs ? JSON.parse(storedLogs) : initialLogs;

    function saveData() {
      localStorage.setItem('cba_crews', JSON.stringify(APP_STATE.crews));
      localStorage.setItem('cba_breaks', JSON.stringify(APP_STATE.breaks));
      localStorage.setItem('cba_breakTypes', JSON.stringify(APP_STATE.breakTypes));
      localStorage.setItem('cba_auditLogs', JSON.stringify(APP_STATE.auditLogs));
      if (APP_STATE.currentUser) {
        localStorage.setItem('cba_user', JSON.stringify(APP_STATE.currentUser));
      } else {
        localStorage.removeItem('cba_user');
      }
    }

    function addAuditLog(action, crewId, crewName) {
      const log = {
        id: 'log_' + Date.now(),
        timestamp: new Date().toISOString(),
        manager: APP_STATE.currentUser ? APP_STATE.currentUser.email : 'system',
        action,
        crewId,
        crewName
      };
      APP_STATE.auditLogs.unshift(log);
      saveData();
    }

    // Toast Notification System
    function showToast(message, type = 'success') {
      const toastContainer = document.getElementById('toast-container') || createToastContainer();
      const toast = document.createElement('div');
      
      const bgColors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-white',
        info: 'bg-brand-600 text-white'
      };

      const icons = {
        success: 'fa-circle-check',
        error: 'fa-triangle-exclamation',
        warning: 'fa-circle-exclamation',
        info: 'fa-circle-info'
      };

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
        <span>${message}</span>
      `;

      toastContainer.appendChild(toast);
      
      // Animate in
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      // Remove after 3.5 seconds
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function createToastContainer() {
      const container = document.createElement('div');
      container.id = 'toast-container';
      container.className = 'fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 z-50 flex flex-col gap-2 pointer-events-none';
      document.body.appendChild(container);
      return container;
    }

    // Helper functions for time formatting
    function formatTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDate(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '-';
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      const pad = (n) => n.toString().padStart(2, '0');
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function getElapsedTimeInSeconds(startTimeIso) {
      const start = new Date(startTimeIso).getTime();
      const now = new Date().getTime();
      return Math.max(0, Math.floor((now - start) / 1000));
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (email && password) {
        APP_STATE.currentUser = {
          email,
          name: email.split('@')[0].toUpperCase(),
          role: 'Manager',
          loginAt: new Date().toISOString()
        };
        saveData();
        showToast(`Selamat datang, Manager (${APP_STATE.currentUser.name})!`, 'success');
        renderApp();
      }
    }

    function handleLogout() {
      if (APP_STATE.scanner) {
        stopScanner();
      }
      APP_STATE.currentUser = null;
      saveData();
      showToast('Anda telah logout.', 'info');
      renderApp();
    }

    function renderDashboardView() {
      const todayStr = new Date().toISOString().split('T')[0];
      const totalCrewCount = APP_STATE.crews.filter(c => c.status === 'Active').length;
      const activeBreaks = APP_STATE.breaks.filter(b => b.status === 'ON BREAK');
      const todayBreaks = APP_STATE.breaks.filter(b => b.date === todayStr);
      
      let totalDurationSecondsToday = 0;
      todayBreaks.forEach(b => {
        if (b.status === 'COMPLETED' && b.durationSeconds) {
          totalDurationSecondsToday += b.durationSeconds;
        } else if (b.status === 'ON BREAK') {
          totalDurationSecondsToday += getElapsedTimeInSeconds(b.startTime);
        }
      });

              </div>
              <div class="flex justify-between text-xs text-slate-600 dark:text-slate-300">

              <i class="fa-solid fa-circle-stop text-xl"></i>

                  <p class="text-xs text-slate-600 dark:text-slate-300">${crew.position} • Dept: ${crew.department} (${crew.crewId})</p>
                </div>
              </div>
              <button onclick="clearScanResult()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Pilih Jenis Break:</label>

                  <label class="cursor-pointer border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-3 rounded-xl flex flex-col justify-between hover:border-brand-500 dark:hover:border-brand-400 transition has-[:checked]:border-brand-600 dark:has-[:checked]:border-brand-400 has-[:checked]:bg-brand-50/50 dark:has-[:checked]:bg-brand-900/30 has-[:checked]:ring-2 has-[:checked]:ring-brand-500">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold text-slate-800 dark:text-slate-200">${bt.name}</span>
                      <input type="radio" name="selected_break_type" value="${bt.name}" data-max="${bt.maxMinutes}" ${index === 0 ? 'checked' : ''} class="text-brand-600 focus:ring-brand-500">

    function processScanBarcode(code) {
      const trimmedCode = code.trim().toUpperCase();
      const crew = APP_STATE.crews.find(c => c.crewId.toUpperCase() === trimmedCode);

      if (!crew) {
        showToast(`✕ QR Code / ID Crew "${trimmedCode}" tidak ditemukan!`, 'error');
        return;
      }

      if (crew.status === 'Inactive') {
        showToast(`⚠ Crew ${crew.name} dalam status Non-Aktif.`, 'warning');
        return;
      }

      APP_STATE.activeScanResult = crew;
      showToast(`✓ Crew ditemukan: ${crew.name} (${crew.crewId})`, 'success');
      
      const container = document.getElementById('scan-result-container');
      if (container) {
        container.innerHTML = renderScanResultCard(crew);
      } else {
        renderApp();
      }
    }

    function executeStartBreak(crewId) {
      const crew = APP_STATE.crews.find(c => c.crewId === crewId);
      if (!crew) return;

      // Ensure crew is not already on break
      const existing = APP_STATE.breaks.find(b => b.crewId === crewId && b.status === 'ON BREAK');
      if (existing) {
        showToast(`⚠ ${crew.name} sudah sedang dalam sesi break.`, 'warning');
        return;
      }

      const radioBtn = document.querySelector('input[name="selected_break_type"]:checked');
      const breakTypeName = radioBtn ? radioBtn.value : 'Meal Break';
      const maxMins = radioBtn ? parseInt(radioBtn.getAttribute('data-max') || '30') : 30;

      const now = new Date();
      const newBreak = {
        id: 'brk_' + Date.now(),
        crewId: crew.crewId,
        crewName: crew.name,
        position: crew.position,
        breakType: breakTypeName,
        maxMinutes: maxMins,
        startTime: now.toISOString(),
        endTime: null,
        durationSeconds: null,
        startedBy: APP_STATE.currentUser.email,
        endedBy: null,
        status: 'ON BREAK',
        date: now.toISOString().split('T')[0]
      };

      APP_STATE.breaks.unshift(newBreak);
      addAuditLog('START BREAK', crew.crewId, crew.name);
      saveData();

      showToast(`✓ Break ${crew.name} berhasil dimulai pada ${formatTime(now.toISOString())}`, 'success');
      APP_STATE.activeScanResult = null;
      switchTab('active');
    }

    function executeEndBreak(breakId) {
      const breakRecord = APP_STATE.breaks.find(b => b.id === breakId);
      if (!breakRecord) return;

      const now = new Date();
      const durationSec = getElapsedTimeInSeconds(breakRecord.startTime);

      breakRecord.endTime = now.toISOString();
      breakRecord.durationSeconds = durationSec;
      breakRecord.endedBy = APP_STATE.currentUser.email;
      breakRecord.status = 'COMPLETED';

      addAuditLog('END BREAK', breakRecord.crewId, breakRecord.crewName);
      saveData();

      const durationFormatted = formatDuration(durationSec);
      showToast(`✓ Break ${breakRecord.crewName} selesai. Total Durasi: ${durationFormatted}`, 'success');

      APP_STATE.activeScanResult = null;
      switchTab('history');
    }

    function handleQuickEndBreak(crewId) {
      const activeBreak = APP_STATE.breaks.find(b => b.crewId === crewId && b.status === 'ON BREAK');
      if (activeBreak) {
        executeEndBreak(activeBreak.id);
      }
    }

    function handleSimulateScan() {
      const select = document.getElementById('sim-crew-select');
      if (select && select.value) {
        switchTab('scan');
        setTimeout(() => {
          processScanBarcode(select.value);
        }, 100);
      }
    }

    function clearScanResult() {
      APP_STATE.activeScanResult = null;
      const container = document.getElementById('scan-result-container');
      if (container) container.innerHTML = '';
    }

    function toggleCameraScanner() {
      if (APP_STATE.scanner) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      const placeholder = document.getElementById('scanner-placeholder');
      if (placeholder) placeholder.style.display = 'none';

      try {
        APP_STATE.scanner = new Html5Qrcode("reader");
        APP_STATE.scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          (decodedText) => {
            // Scanner success callback
            processScanBarcode(decodedText);
          },
          (errorMessage) => {
            // parse error, ignore standard scanning frames
          }
        ).catch(err => {
          showToast("Tidak dapat mengakses kamera: " + err, "error");
          if (placeholder) placeholder.style.display = 'block';
        });

        const btn = document.getElementById('btn-toggle-cam');
        if (btn) {
          btn.innerHTML = `<i class="fa-solid fa-video-slash"></i> <span>Matikan Kamera</span>`;
          btn.classList.replace('bg-brand-600', 'bg-rose-600');
          btn.classList.replace('hover:bg-brand-700', 'hover:bg-rose-700');
        }
      } catch (e) {
        showToast("Gagal memuat library scanner.", "error");
      }
    }

    function stopScanner() {
      if (APP_STATE.scanner) {
        APP_STATE.scanner.stop().then(() => {
          APP_STATE.scanner = null;
          const btn = document.getElementById('btn-toggle-cam');
          if (btn) {
            btn.innerHTML = `<i class="fa-solid fa-video"></i> <span>Aktifkan Kamera</span>`;
            btn.classList.replace('bg-rose-600', 'bg-brand-600');
            btn.classList.replace('hover:bg-rose-700', 'hover:bg-brand-700');
          }
        }).catch(err => {
          APP_STATE.scanner = null;
        });
      }
    }

    function exportToExcel() {
      const data = APP_STATE.breaks.map(b => ({
        'Tanggal': formatDate(b.startTime),
        'Crew ID': b.crewId,
        'Nama Crew': b.crewName,
        'Posisi': b.position,
        'Jenis Break': b.breakType,
        'Jam Mulai': formatTime(b.startTime),
        'Jam Selesai': b.endTime ? formatTime(b.endTime) : 'Sedang Break',
        'Durasi': b.durationSeconds ? formatDuration(b.durationSeconds) : '-',
        'Manager Scanner': b.startedBy,
        'Status': b.status
      }));

      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Break Attendance");

      const todayStr = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `Crew_Break_Report_${todayStr}.xlsx`);
      showToast("✓ Report Excel berhasil di-export!", "success");
    }

    function initReportChart() {
      const ctx = document.getElementById('breakChart');
      if (!ctx) return;

      const typeCounts = {};
      APP_STATE.breakTypes.forEach(bt => typeCounts[bt.name] = 0);
      APP_STATE.breaks.forEach(b => {
        if (typeCounts[b.breakType] !== undefined) {
          typeCounts[b.breakType]++;
        }
      });

      const isDark = APP_STATE.theme === 'dark';

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(typeCounts),
          datasets: [{
            label: 'Jumlah Sesi Break',
            data: Object.values(typeCounts),
            backgroundColor: ['#0284c7', '#10b981', '#f59e0b', '#8b5cf6'],
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { color: isDark ? '#94a3b8' : '#64748b' },
              grid: { color: isDark ? '#334155' : '#e2e8f0' }
            },
            y: {
              ticks: { color: isDark ? '#94a3b8' : '#64748b' },
              grid: { color: isDark ? '#334155' : '#e2e8f0' }
            }
          }
        }
      });
    }

          <div>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Pengaturan Sistem & Integrasi</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kelola tema tampilan, integrasi Google Sheets, dan audit log</p>
          </div>

          <!-- Theme Preference Control Card -->
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 flex items-center justify-center font-bold text-lg">
                  <i class="fa-solid ${APP_STATE.theme === 'dark' ? 'fa-moon' : 'fa-sun'}"></i>
                </div>
                <div>
                  <h3 class="font-bold text-slate-900 dark:text-white text-sm">Tema Tampilan Aplikasi</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">Pilih antara Mode Terang (Light) atau Mode Gelap (Dark)</p>
                </div>
              </div>

              <button 
                onclick="toggleTheme()" 
                class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-xs transition flex items-center gap-2"
              >
                <i class="fa-solid ${APP_STATE.theme === 'dark' ? 'fa-sun text-amber-400' : 'fa-moon'}"></i>
                <span>${APP_STATE.theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}</span>
              </button>
            </div>
          </div>

          <!-- Google Sheets Webhook Integration -->
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-400 flex items-center justify-center font-bold text-lg">
                <i class="fa-solid fa-file-csv"></i>
              </div>
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm">Integrasi Google Sheets Automatic Sync</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Kirim data transaksi break yang selesai secara otomatis ke Google Spreadsheet</p>
              </div>
            </div>

            <div class="space-y-3 pt-2">
              <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Google Apps Script Webhook URL</label>
                <input 
                  type="url" 
                  id="sheets-url-input" 
                  value="${APP_STATE.settings.googleSheetsUrl}" 
                  placeholder="https://script.google.com/macros/s/.../exec"
                  class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl text-xs focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500"
                >
              </div>

              <div class="flex items-center justify-between pt-2">
                <button 
                  onclick="saveSheetsConfig()" 
                  class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs transition"
                >
                  Simpan URL Webhook
                </button>

                <button 
                  onclick="showToast('Sistem siap menyinkronkan data saat sesi break diselesaikan.', 'info')" 
                  class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition"
                >
                  Uji Koneksi Sync
                </button>
              </div>
            </div>
          </div>

          <!-- Audit Log Section -->
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <h3 class="font-bold text-slate-900 dark:text-white text-sm mb-3">System Audit Logs</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar text-xs">
              ${APP_STATE.auditLogs.map(log => `
                <div class="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl flex items-center justify-between">
                  <div>
                    <span class="font-bold text-slate-800 dark:text-slate-200">${log.action}</span>
                    <span class="text-slate-500 dark:text-slate-400"> - ${log.crewName} (${log.crewId})</span>
                  </div>
                  <span class="text-[10px] text-slate-400 dark:text-slate-500">${formatTime(log.timestamp)}</span>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    function renderModals() {
      if (!APP_STATE.activeModal) return '';

      if (APP_STATE.activeModal === 'addCrew') {
        return `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-in space-y-5 border border-slate-100 dark:border-slate-700">
              <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-slate-900 dark:text-white text-base">Tambah Data Crew Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
              </div>

              <form onsubmit="handleCreateCrew(event)" class="space-y-4 text-xs">
                <div>
                  <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap Crew</label>
                  <input type="text" id="crew-name" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Posisi / Jabatan</label>
                  <input type="text" id="crew-position" required placeholder="Contoh: Senior Barista" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Departemen</label>
                  <input type="text" id="crew-dept" required placeholder="Contoh: Service" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">No. Telepon / Whatsapp (Opsional)</label>
                  <input type="tel" id="crew-phone" placeholder="08123456789" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="pt-3 flex gap-2">
                  <button type="button" onclick="closeModal()" class="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition">Batal</button>
                  <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition">Simpan Crew</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (APP_STATE.activeModal === 'qrCode' && APP_STATE.selectedCrewForModal) {
        const c = APP_STATE.selectedCrewForModal;
        return `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-fade-in text-center space-y-4 border border-slate-100 dark:border-slate-700">
              
              <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Kartu QR Code Crew</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
              </div>

              <!-- Printable ID Card Container -->
              <div id="printable-qr-card" class="p-6 bg-gradient-to-b from-slate-900 via-brand-950 to-slate-900 text-white rounded-3xl shadow-xl space-y-4 border border-slate-800">
                <div class="flex items-center justify-center gap-2">
                  <i class="fa-solid fa-mug-hot text-brand-400"></i>
                  <span class="font-bold text-xs tracking-wider uppercase">Crew Pass</span>
                </div>

                <div id="qr-code-display" class="bg-white p-3 rounded-2xl inline-block shadow-inner"></div>

                <div>
                  <h3 class="text-lg font-extrabold text-white">${c.name}</h3>
                  <p class="text-xs text-brand-300 font-medium">${c.position}</p>
                  <div class="mt-2 inline-block px-3 py-1 bg-white/10 rounded-full font-mono text-xs font-bold text-emerald-400 border border-white/20">
                    ID: ${c.crewId}
                  </div>
                </div>
              </div>

              <div class="flex gap-2">
                <button onclick="window.print()" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl transition">
                  <i class="fa-solid fa-print mr-1"></i> Cetak Card
                </button>
                <button onclick="closeModal()" class="py-2.5 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition">
                  Tutup
                </button>
              </div>

            </div>
          </div>
        `;
      }

      return '';
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      
      if (!APP_STATE.currentUser) {
        appEl.innerHTML = renderLoginView();
        return;
      }

      let mainViewContent = '';
      switch (APP_STATE.activeTab) {
        case 'dashboard':
          mainViewContent = renderDashboardView();
          break;
        case 'scan':
          mainViewContent = renderScanView();
          break;
        case 'active':
          mainViewContent = renderActiveBreakView();
          break;
        case 'history':
          mainViewContent = renderHistoryView();
          break;
        case 'crews':
          mainViewContent = renderCrewManagementView();
          break;
        case 'reports':
          mainViewContent = renderReportsView();
          break;
        case 'settings':
          mainViewContent = renderSettingsView();
          break;
        default:
          mainViewContent = renderDashboardView();
      }

      appEl.innerHTML = `
        ${renderNavigation()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${mainViewContent}
        </main>
        ${renderModals()}
      `;

      if (APP_STATE.activeTab === 'reports') {
        setTimeout(initReportChart, 50);
      }
    }

    // Interval to update live duration timers on active break elements
    setInterval(() => {
      const timerEls = document.querySelectorAll('.live-timer');
      timerEls.forEach(el => {
        const startTime = el.getAttribute('data-start');
        if (startTime) {
          const elapsed = getElapsedTimeInSeconds(startTime);
          el.textContent = formatDuration(elapsed);
        }
      });
    }, 1000);

    // Initial page initialization
    window.onload = function() {
      initSeedData();
      renderApp();
    };
  </script>

</body>
</html>
